name: ScamShield AI - CI Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit & Integration Tests
      run: |
        python tests/test_pipeline.py

    - name: Run Module 2 Backend & API Tests
      run: |
        python tests/test_module2.py

    - name: Run End-to-End Smoke Tests
      run: |
        python smoke_test.py

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScamShield-AI-debug-apk
        path: mobile/android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
